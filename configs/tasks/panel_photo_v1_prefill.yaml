# Pre-fill variant (prompt `prefill`, recall-oriented; seeds the review drafts). Task: transcribe the curated Wikimedia Commons panel photos (split panel_photo_v1,
# manifest data/gt/panel_photo_v1/manifest.jsonl) into complete schema v0 documents.
name: panel_photo_v1_prefill
description: Transcribe one real panel photograph into the complete schema v0 topology, trackside elements, routes and state.
source_kind: panel_photo
split: panel_photo_v1
prompt: prefill
metrics:
  - detection_prf1
  - label_cer
  - state_accuracy
  - route_prf1
  - topology_agreement
  - calibration_ece
  - latency_p95_ms
  - cost_usd
