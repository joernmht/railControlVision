# Ground-truth pre-fill run: every pilot image through the pre-fill lineup with the
# recall-oriented `prefill` prompt, single shot; the drafts Joern corrects are merged from it.
# The neutral benchmark run is configs/run.baseline.yaml (same models, prompt single_shot).
# out_dir is inside data/ so the run is versioned with DVC (runs/ is gitignored).
name: prefill-2026-10-06
task: configs/tasks/panel_photo_v1_prefill.yaml
catalogue: configs/models.prefill.yaml
models:
  - claude-opus-5.5
  - gpt-6.1-sol
  - gemini-3.1-pro
  - kimi-k3
  - qwen3.8-27b
mode: single_shot
seed: 0
out_dir: data/runs
tracker: "null"
