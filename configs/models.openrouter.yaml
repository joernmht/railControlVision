# Benchmark lineup with provider-default settings (rail_vision_bench.config.ModelCatalogue),
# used by configs/run.baseline.yaml; configs/models.prefill.yaml is the same lineup with
# reasoning effort high for the ground-truth pre-fill. All reached through
# OpenRouter's OpenAI-compatible endpoint with OPENROUTER_API_KEY. One current flagship per
# vendor plus two open-weight models, chosen 2026-10-06; ids and prices from
# https://openrouter.ai/api/v1/models on that day (USD per 1k tokens). OpenRouter reports the
# billed cost per call, which takes precedence over these rates.
# Models used here seed the ground truth, so later comparisons must also score models that
# are NOT in this list (see data/README.md, "Model-seeded ground truth").
models:
  - name: claude-opus-5.5
    provider: openai
    model_id: anthropic/claude-opus-5.5
    cost_per_1k_in: 0.004
    cost_per_1k_out: 0.020
    params:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY

  - name: gpt-6.1-sol
    provider: openai
    model_id: openai/gpt-6.1-sol
    cost_per_1k_in: 0.002
    cost_per_1k_out: 0.010
    params:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY

  - name: gemini-3.1-pro
    provider: openai
    model_id: google/gemini-3.1-pro-preview
    cost_per_1k_in: 0.002
    cost_per_1k_out: 0.012
    params:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY

  - name: kimi-k3
    provider: openai
    model_id: moonshotai/kimi-k3
    cost_per_1k_in: 0.00083
    cost_per_1k_out: 0.014
    params:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY

  - name: qwen3.8-27b
    provider: openai
    model_id: qwen/qwen3.8-27b
    cost_per_1k_in: 0.00042
    cost_per_1k_out: 0.00255
    params:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: OPENROUTER_API_KEY
